<!DOCTYPE html><html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex"><title>Admin prenotazioni</title><link rel="stylesheet" href="style.css"></head>
<body><main><h1>Prenotazioni</h1><div id="list"></div>
<script>
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function call(method, id) {
  const r = await fetch('/api/admin' + (id ? '?id=' + id : ''), { method, headers: { 'x-password': sessionStorage.getItem('pw') || '' } });
  if (r.status === 401) { const p = prompt('Password admin:'); if (!p) return null; sessionStorage.setItem('pw', p); return call(method, id); }
  return r.json();
}
async function load() {
  const data = await call('GET');
  if (!Array.isArray(data)) return;
  document.querySelector('#list').innerHTML = data.map(b => `
    <div class="card row"><div><strong>${esc(b.date)} ${esc(b.time)}</strong> — ${esc(b.name)}
    <div class="muted">${esc(b.email)} ${esc(b.phone)}<br>${esc(b.notes)}</div></div>
    <button onclick="del('${esc(b.id)}')">Annulla</button></div>`).join('') || '<p class="muted">Nessuna prenotazione futura.</p>';
}
async function del(id) { if (confirm('Annullare questa prenotazione?')) { await call('DELETE', id); load(); } }
load();
</script></main></body></html>
